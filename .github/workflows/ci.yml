name: CI — Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # 1. Soroban Smart Contracts (Rust)
  # ──────────────────────────────────────────────
  contracts:
    name: Soroban Smart Contracts (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Check Formatting
        working-directory: contracts/escrow_contract
        run: cargo fmt --all -- --check

      - name: Build Escrow Contract (WASM)
        working-directory: contracts/escrow_contract
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Build Swap Contract (WASM)
        working-directory: contracts/swap_contract
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Test Escrow Contract (7 tests)
        working-directory: contracts/escrow_contract
        run: cargo test --verbose

      - name: Test Swap Contract (4 tests)
        working-directory: contracts/swap_contract
        run: cargo test --verbose

  # ──────────────────────────────────────────────
  # 2. Frontend (React 18 + TypeScript + Vite)
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend Application (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
        env:
          VITE_STELLAR_NETWORK: testnet
          VITE_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          VITE_STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          VITE_SWAP_CONTRACT_ID: CD32CDHJPRITTOX53LSKONEOTPC2QR55MLWGQET3X46O2EQNFOZK423S
          VITE_ESCROW_CONTRACT_ID: CC9X7K4YMQW4L6P8S1U0N5R2T9V3W8Z6Y7X0A1B2C3D4E5F6G7H8J9K0

      - name: Verify production dist output
        run: |
          test -f dist/index.html && echo "✅ Production index.html verified successfully"
