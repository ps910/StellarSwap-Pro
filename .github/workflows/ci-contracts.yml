name: CI — Soroban Smart Contracts

on:
  push:
    branches: [main, master]
    paths:
      - 'contracts/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'contracts/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ──────────────────────────────────────────────
  # Lint & Format — cargo fmt check
  # ──────────────────────────────────────────────
  format:
    name: Rustfmt Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting — Escrow Contract
        working-directory: contracts/escrow_contract
        run: cargo fmt --all -- --check

      - name: Check formatting — Swap Contract
        working-directory: contracts/swap_contract
        run: cargo fmt --all -- --check

  # ──────────────────────────────────────────────
  # Build — cargo build for wasm32 target
  # ──────────────────────────────────────────────
  build:
    name: Build Soroban Contracts
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow_contract/target
            contracts/swap_contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Escrow Contract
        working-directory: contracts/escrow_contract
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Build Swap Contract
        working-directory: contracts/swap_contract
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm-contracts
          path: |
            contracts/escrow_contract/target/wasm32-unknown-unknown/release/*.wasm
            contracts/swap_contract/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 14

  # ──────────────────────────────────────────────
  # Test — cargo test for both contracts
  # ──────────────────────────────────────────────
  test:
    name: Run Contract Tests
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow_contract/target
            contracts/swap_contract/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Test Escrow Contract (7 tests)
        working-directory: contracts/escrow_contract
        run: cargo test --verbose

      - name: Test Swap Contract (6 tests)
        working-directory: contracts/swap_contract
        run: cargo test --verbose
