name: CI — Soroban Smart Contracts

on:
  push:
    branches: [main, master]
    paths:
      - 'contracts/**'
      - '.github/workflows/ci-contracts.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'contracts/**'
      - '.github/workflows/ci-contracts.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-build:
    name: Test & Build Smart Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow_contract/target
            contracts/swap_contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Formatting — Escrow Contract
        working-directory: contracts/escrow_contract
        run: cargo fmt --all -- --check

      - name: Check Formatting — Swap Contract
        working-directory: contracts/swap_contract
        run: cargo fmt --all -- --check

      - name: Run Escrow Contract Tests (7 tests)
        working-directory: contracts/escrow_contract
        run: cargo test --verbose

      - name: Run Swap Contract Tests (4 tests)
        working-directory: contracts/swap_contract
        run: cargo test --verbose

      - name: Build Escrow Contract (WASM)
        working-directory: contracts/escrow_contract
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Build Swap Contract (WASM)
        working-directory: contracts/swap_contract
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Upload Contract WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-contracts-wasm
          path: |
            contracts/escrow_contract/target/wasm32-unknown-unknown/release/*.wasm
            contracts/swap_contract/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 14
