    <!-- Sentry Error Monitoring -->

    ></script>
    <script>
      try {
        if (typeof Sentry !== 'undefined') {
          Sentry.init({
            dsn: 'https://f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6@o0.ingest.sentry.io/0',
            environment: 'production',
            release: 'stellex-pro@6.0.0',
            tracesSampleRate: 0.2,
            replaysSessionSampleRate: 0.1,
            replaysOnErrorSampleRate: 1.0,
            beforeSend(event) {
              if (event.exception) {
                console.warn('[StellEx Pro] Sentry captured exception:', event.exception);
              }
              return event;
            },
          });
        }
      } catch (e) {
        console.warn('[StellEx Pro] Sentry init deferred (offline/ad-blocker):', e);
      }
    </script>
    <!-- Initialize Monitoring Log -->
    <script>
      if (typeof window !== 'undefined') {
        window.__SENTRY_ACTIVE__ = true;
        window.__POSTHOG_ACTIVE__ = true;
        console.log('[StellEx Pro] Monitoring & Telemetry initialized for StellEx Pro');
